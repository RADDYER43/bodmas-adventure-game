<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BODMAS Adventure</title>
  <style>
    :root {
      --bg1: #0a1220;
      --bg2: #1d2b45;
      --panel: rgba(10, 18, 30, 0.8);
      --gold: #ffd166;
      --green: #8ef0b1;
      --red: #ff8d8d;
      --info: #e9f3ff;
      --shadow: rgba(0,0,0,0.38);
      --outline: rgba(255,255,255,0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #203150 0%, var(--bg1) 32%, var(--bg2) 100%);
      color: white;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .game {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--outline);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 70px var(--shadow);
      position: relative;
    }

    .game.shake {
      animation: shake 0.45s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--outline);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.4rem);
      letter-spacing: 1px;
    }

    .hud {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hud span {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .scene {
      position: relative;
      height: 300px;
      overflow: hidden;
      border-bottom: 1px solid var(--outline);
      background: linear-gradient(180deg, #7ec9ff 0%, #d9efff 30%, #9ee0a0 30%, #3a7f49 100%);
    }

    .scene-0 { background: linear-gradient(180deg, #7ec9ff 0%, #d9efff 30%, #9ee0a0 30%, #3a7f49 100%); }
    .scene-1 { background: linear-gradient(180deg, #1a2f49 0%, #48627b 30%, #c8d5de 30%, #5e6c63 100%); }
    .scene-2 { background: linear-gradient(180deg, #d3f4ff 0%, #96d8ff 32%, #64c5c4 32%, #185c65 100%); }
    .scene-3 { background: linear-gradient(180deg, #ffe39a 0%, #f7bb69 30%, #a9d96d 30%, #4b7e4f 100%); }
    .scene-4 { background: linear-gradient(180deg, #b7e5ff 0%, #78baf5 30%, #7a8fb7 30%, #3e4d63 100%); }
    .scene-5 { background: linear-gradient(180deg, #d8fbff 0%, #aad6ff 30%, #5ac1d2 30%, #214d5f 100%); }
    .scene-6 { background: linear-gradient(180deg, #f0f0d2 0%, #d3ebff 30%, #8ac6db 30%, #3d4f62 100%); }
    .scene-7 { background: linear-gradient(180deg, #fff1b5 0%, #f7c75c 30%, #d36a24 30%, #5a352f 100%); }

    .sky-objects {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .moon, .sun, .star {
      position: absolute;
      font-size: 52px;
      filter: drop-shadow(0 0 16px rgba(255,255,255,0.4));
      animation: float 6s ease-in-out infinite;
    }

    .moon { right: 85px; top: 24px; }
    .sun { right: 80px; top: 28px; }
    .star { font-size: 28px; opacity: 0.9; animation: twinkle 2s ease-in-out infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.65);
      border-radius: 999px;
      opacity: 0.7;
      animation: cloudFloat 16s linear infinite;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }

    .cloud::before {
      width: 30px; height: 30px;
      left: 16px; top: -14px;
    }

    .cloud::after {
      width: 38px; height: 38px;
      right: 18px; top: -18px;
    }

    @keyframes cloudFloat {
      0% { transform: translateX(-80px); }
      100% { transform: translateX(900px); }
    }

    .hill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36%;
      background: rgba(17, 72, 39, 0.65);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      z-index: 1;
    }

    .bridge {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      font-size: 58px;
      z-index: 2;
      animation: float 4s ease-in-out infinite;
    }

    .tree {
      position: absolute;
      left: 38px;
      bottom: 32px;
      font-size: 74px;
      z-index: 2;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
    }

    .castle {
      position: absolute;
      right: 52px;
      bottom: 34px;
      font-size: 78px;
      z-index: 2;
      animation: float 5s ease-in-out infinite;
    }

    .obstacle-box {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 4;
      width: 220px;
      text-align: center;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      padding: 12px 18px;
      backdrop-filter: blur(4px);
      box-shadow: 0 12px 22px rgba(0,0,0,0.18);
      animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }

    .obstacle-icon {
      font-size: 48px;
      margin-bottom: 4px;
    }

    .obstacle-name {
      font-weight: 700;
      letter-spacing: 1px;
      font-size: 1.15rem;
    }

    .panel {
      padding: 22px;
    }

    .story {
      margin: 0 0 18px;
      min-height: 60px;
      font-size: 1.04rem;
      color: var(--info);
      line-height: 1.6;
    }

    .question-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .question-label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    .question {
      font-size: clamp(1.4rem, 2.8vw, 2.3rem);
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .answer-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      min-width: 180px;
      font-size: 1.08rem;
      padding: 15px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: white;
      outline: none;
    }

    input:focus {
      border-color: rgba(127, 231, 154, 0.8);
      box-shadow: 0 0 0 3px rgba(127,231,154,0.15);
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.14s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, #7af2d3, #63c8c7);
      color: #102030;
    }

    .secondary {
      background: linear-gradient(135deg, #ffd166, #ffb703);
      color: #1f1f22;
    }

    .result {
      min-height: 54px;
      margin: 0;
      padding-top: 8px;
      font-weight: 600;
      line-height: 1.5;
    }

    .good { color: var(--green); }
    .bad { color: #ffc4c4; }
    .info { color: var(--info); }

    .hidden { display: none; }

    .success-glow {
      box-shadow: 0 0 0 0 rgba(142, 240, 177, 0.8);
      animation: pulseGreen 0.8s ease-out;
    }

    .fail-glow {
      box-shadow: 0 0 0 0 rgba(255, 141, 141, 0.75);
      animation: pulseRed 0.7s ease-out;
    }

    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(142, 240, 177, 0.8); }
      100% { box-shadow: 0 0 18px 14px rgba(142, 240, 177, 0); }
    }

    @keyframes pulseRed {
      0% { box-shadow: 0 0 0 0 rgba(255, 141, 141, 0.8); }
      100% { box-shadow: 0 0 18px 14px rgba(255, 141, 141, 0); }
    }

    @media (max-width: 560px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .answer-row {
        flex-direction: column;
      }

      input, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="game" id="game">
    <div class="topbar">
      <h1>BODMAS Adventure</h1>
      <div class="hud">
        <span id="levelBadge">Level 1 / 8</span>
        <span id="scoreBadge">Score: 0</span>
      </div>
    </div>

    <div id="scene" class="scene scene-0">
      <div class="sky-objects">
        <div class="moon">🌙</div>
        <div class="star" style="top: 40px; left: 80px;">✦</div>
        <div class="star" style="top: 90px; left: 180px;">✦</div>
        <div class="star" style="top: 48px; left: 340px;">✦</div>
        <div class="star" style="top: 90px; left: 520px;">✦</div>
        <div class="cloud" style="width: 120px; height: 32px; left: 30px; top: 58px;"></div>
        <div class="cloud" style="width: 150px; height: 35px; left: 220px; top: 100px; animation-delay: 4s;"></div>
        <div class="cloud" style="width: 100px; height: 28px; left: 520px; top: 70px; animation-delay: 8s;"></div>
      </div>

      <div class="tree">🌲</div>
      <div class="bridge">🌉</div>
      <div class="castle">🏰</div>
      <div class="hill"></div>

      <div class="obstacle-box">
        <div id="obstacleIcon" class="obstacle-icon">🧙</div>
        <div id="obstacleName" class="obstacle-name">Wizard</div>
      </div>
    </div>

    <div class="panel">
      <p id="story" class="story">A wizard blocks the gate. Solve the BODMAS challenge to unlock the path.</p>

      <div class="question-box">
        <span class="question-label">BODMAS challenge</span>
        <div id="question" class="question">6 + 3 × 4</div>
      </div>

      <div class="answer-row">
        <input id="answerInput" type="number" placeholder="Enter your answer" />
        <button id="submitBtn" class="primary">Unlock</button>
      </div>

      <button id="nextBtn" class="secondary hidden">Next Level</button>

      <p id="result" class="result info">Remember: Brackets, Orders, Division, Multiplication, Addition, Subtraction.</p>
    </div>
  </div>

  <script>
    const totalLevels = 8;

    const obstacleData = [
      { name: "Troll", icon: "🪓", story: "A grumpy troll guards the forest bridge. Solve the puzzle to open the gate." },
      { name: "Wizard", icon: "🧙", story: "A moonlit wizard blocks the path. Crack the spell with BODMAS." },
      { name: "Unicorn", icon: "🦄", story: "A magical unicorn guards the crystal lake. Answer correctly to receive the key." },
      { name: "Dragon", icon: "🐉", story: "A dragon watches over the canyon. Only a brave thinker can pass." },
      { name: "Goblin", icon: "👺", story: "A sneaky goblin demands a math challenge before unlocking the bridge." },
      { name: "Sorcerer", icon: "🧝", story: "The elder sorcerer controls the ice gate. Solve it to continue." },
      { name: "Forest Guardian", icon: "🌿", story: "The forest guardian stands in the ruins. Finish the challenge to win the path." },
      { name: "Math King", icon: "👑", story: "You have reached the final boss of the Number Kingdom. Defeat the king!" }
    ];

    const sceneThemes = [
      { moon: "🌙", tree: "🌲", bridge: "🌉", castle: "🏰" },
      { moon: "🌙", tree: "🌲", bridge: "🕳️", castle: "🏰" },
      { moon: "🌙", tree: "🌿", bridge: "💧", castle: "🏰" },
      { moon: "☀️", tree: "🌵", bridge: "🏜️", castle: "🏰" },
      { moon: "⛈️", tree: "🌲", bridge: "⚡", castle: "🏰" },
      { moon: "❄️", tree: "🌲", bridge: "🧊", castle: "🏰" },
      { moon: "🌙", tree: "🌴", bridge: "🏛️", castle: "🏰" },
      { moon: "✨", tree: "🌳", bridge: "🏰", castle: "👑" }
    ];

    let currentLevel = 0;
    let score = 0;
    let currentQuestion = null;

    const gameEl = document.getElementById("game");
    const sceneEl = document.getElementById("scene");
    const obstacleIconEl = document.getElementById("obstacleIcon");
    const obstacleNameEl = document.getElementById("obstacleName");
    const storyEl = document.getElementById("story");
    const questionEl = document.getElementById("question");
    const answerInput = document.getElementById("answerInput");
    const submitBtn = document.getElementById("submitBtn");
    const nextBtn = document.getElementById("nextBtn");
    const resultEl = document.getElementById("result");
    const levelBadge = document.getElementById("levelBadge");
    const scoreBadge = document.getElementById("scoreBadge");

    let audioCtx = null;

    const sound = {
      init() {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioCtx();
        }
      },

      tone(freq, duration, type = "sine", gainLevel = 0.06) {
        this.init();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = type;
        oscillator.frequency.value = freq;

        gainNode.gain.value = gainLevel;
        gainNode.gain.setTargetAtTime(0.0001, audioCtx.currentTime + duration, 0.03);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duration);
      },

      correct() {
        this.tone(660, 0.12, "triangle", 0.08);
        setTimeout(() => this.tone(880, 0.14, "triangle", 0.07), 120);
      },

      wrong() {
        this.tone(180, 0.18, "sawtooth", 0.07);
      },

      win() {
        this.tone(523, 0.18, "triangle", 0.08);
        setTimeout(() => this.tone(659, 0.18, "triangle", 0.08), 180);
        setTimeout(() => this.tone(784, 0.22, "triangle", 0.08), 360);
      }
    };

    document.body.addEventListener("pointerdown", () => {
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }, { once: true });

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function createQuestion(levelIndex) {
      switch (levelIndex) {
        case 0: {
          const a = randomInt(3, 9);
          const b = randomInt(2, 6);
          const c = randomInt(2, 6);
          return { question: `${a} + ${b} × ${c}`, answer: a + b * c };
        }
        case 1: {
          const x = randomInt(8, 15);
          const y = randomInt(2, 6);
          const z = randomInt(2, 5);
          return { question: `${x} - ${y} × ${z}`, answer: x - y * z };
        }
        case 2: {
          const p = randomInt(3, 8);
          const q = randomInt(2, 6);
          const r = randomInt(2, 6);
          return { question: `(${p} + ${q}) × ${r}`, answer: (p + q) * r };
        }
        case 3: {
          const d = randomInt(3, 8);
          const e = randomInt(2, 7);
          const f = randomInt(2, 6);
          return { question: `${d * e} ÷ ${d} + ${f}`, answer: (d * e) / d + f };
        }
        case 4: {
          const m = randomInt(3, 8);
          const n = randomInt(2, 5);
          const t = randomInt(4, 9);
          const diff = randomInt(2, 4);
          return { question: `${m} + ${n} × (${t} - ${t - diff})`, answer: m + n * (t - (t - diff)) };
        }
        case 5: {
          const g = randomInt(2, 5);
          const h = randomInt(2, 5);
          const i = randomInt(2, 5);
          return { question: `${(g + h) * (i + 2)} ÷ (${g} + ${h}) + ${i}`, answer: ((g + h) * (i + 2)) / (g + h) + i };
        }
        case 6: {
          const j = randomInt(2, 5);
          const k = randomInt(2, 5);
          const l = randomInt(2, 5);
          return { question: `(${j} + ${k}) × ${l} - ${k + 1}`, answer: (j + k) * l - (k + 1) };
        }
        case 7: {
          const u = randomInt(2, 6);
          const v = randomInt(2, 7);
          const w = randomInt(3, 7);
          return { question: `${u * v} ÷ ${u} + ${w} × (${v + 2} - ${v})`, answer: (u * v) / u + w * ((v + 2) - v) };
        }
        default:
          return { question: "8 + 2 × 3", answer: 14 };
      }
    }

    function setScene(levelIndex) {
      const theme = sceneThemes[levelIndex];
      const moonEl = sceneEl.querySelector(".moon");
      if (moonEl) moonEl.textContent = theme.moon;
      const treeEl = sceneEl.querySelector(".tree");
      if (treeEl) treeEl.textContent = theme.tree;
      const bridgeEl = sceneEl.querySelector(".bridge");
      if (bridgeEl) bridgeEl.textContent = theme.bridge;
      const castleEl = sceneEl.querySelector(".castle");
      if (castleEl) castleEl.textContent = theme.castle;
      sceneEl.className = `scene scene-${levelIndex}`;
    }

    function buildLevel(levelIndex) {
      const obstacle = obstacleData[levelIndex];
      currentQuestion = createQuestion(levelIndex);

      setScene(levelIndex);
      obstacleIconEl.textContent = obstacle.icon;
      obstacleNameEl.textContent = obstacle.name;
      storyEl.textContent = obstacle.story;
      questionEl.textContent = currentQuestion.question;
      answerInput.value = "";
      answerInput.disabled = false;
      answerInput.focus();

      resultEl.className = "result info";
      resultEl.textContent = "Remember: Brackets, Orders, Division, Multiplication, Addition, Subtraction.";

      submitBtn.disabled = false;
      nextBtn.classList.add("hidden");
      nextBtn.textContent = "Next Level";

      levelBadge.textContent = `Level ${levelIndex + 1} / ${totalLevels}`;
    }

    function triggerSuccess() {
      gameEl.classList.remove("success-glow");
      void gameEl.offsetWidth;
      gameEl.classList.add("success-glow");
      sound.correct();

      setTimeout(() => {
        gameEl.classList.remove("success-glow");
      }, 700);
    }

    function triggerFail() {
      gameEl.classList.remove("fail-glow");
      void gameEl.offsetWidth;
      gameEl.classList.add("fail-glow");
      sound.wrong();
      gameEl.classList.add("shake");
      setTimeout(() => gameEl.classList.remove("shake"), 430);
      setTimeout(() => {
        gameEl.classList.remove("fail-glow");
      }, 700);
    }

    function handleSubmit() {
      const value = Number(answerInput.value);

      if (answerInput.value === "" || Number.isNaN(value)) {
        resultEl.className = "result bad";
        resultEl.textContent = "Please enter a number before unlocking the obstacle.";
        triggerFail();
        return;
      }

      if (value === currentQuestion.answer) {
        score += 1;
        scoreBadge.textContent = `Score: ${score}`;

        resultEl.className = "result good";
        resultEl.textContent = "Correct! The obstacle is defeated and the path opens!";

        triggerSuccess();

        submitBtn.disabled = true;
        nextBtn.classList.remove("hidden");
      } else {
        resultEl.className = "result bad";
        resultEl.textContent = "Not quite. Re-check the BODMAS order and try again.";
        triggerFail();
      }
    }

    function handleNext() {
      if (currentLevel < totalLevels - 1) {
        currentLevel += 1;
        buildLevel(currentLevel);
      } else {
        finishGame();
      }
    }

    function finishGame() {
      sound.win();

      storyEl.textContent = "You completed all 8 levels and conquered the Number Kingdom.";
      questionEl.textContent = "YOU WIN!";
      resultEl.className = "result good";
      resultEl.textContent = `Final score: ${score} / ${totalLevels}. You are a BODMAS champion!`;
      answerInput.disabled = true;
      answerInput.value = "";
      submitBtn.disabled = true;
      nextBtn.classList.remove("hidden");
      nextBtn.textContent = "Play Again";

      nextBtn.onclick = () => {
        currentLevel = 0;
        score = 0;
        scoreBadge.textContent = "Score: 0";
        nextBtn.textContent = "Next Level";
        nextBtn.onclick = handleNext;
        buildLevel(0);
      };
    }

    answerInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        handleSubmit();
      }
    });

    submitBtn.addEventListener("click", handleSubmit);
    nextBtn.addEventListener("click", handleNext);

    buildLevel(0);
  </script>
</body>
</html>
